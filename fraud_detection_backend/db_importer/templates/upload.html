{% extends "base_generic.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <!-- Upload Section -->
    <div class="bg-white shadow-md rounded-lg p-6 my-4">
        <h1 class="text-3xl font-bold text-blue-900 mb-4">Upload CSV File</h1>
        <p class="text-gray-700 mb-4">
            Please upload your CSV file using the form below.
        </p>

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}

            <!-- Custom Button Styling -->
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Upload File
            </button>
        </form>
    </div>
</div>
{% endblock %}
