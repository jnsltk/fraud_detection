{% extends "base_generic.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white shadow-md rounded-lg p-8 mt-10">
    <h1 class="text-2xl font-bold text-center text-blue-800 mb-4">Reset Password</h1>
    <form action="" method="post">
        {% csrf_token %}

        <div class="space-y-4">
            <div>
                {% if form.email.errors %}
                <div class="text-red-700 bg-red-100 border border-red-400 p-2 rounded-md">
                    {{ form.email.errors }}
                </div>
                {% endif %}
                <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" name="{{ form.email.name }}" id="{{ form.email.id_for_label }}" value="{{ form.email.value|default_if_none:'' }}" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
        </div>

        <div class="mt-6">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Reset Password
            </button>
        </div>
    </form>
</div>
{% endblock %}
