{% extends "base_generic.html" %}

{% block content %}

{% include "home_page/logged_out_nav_bar.html" %}

<div class="flex flex-col justify-center items-center bg-gradient-to-bl from-[#f53f0f] to-[#102c89] h-screen w-screen text-white">
    <h1 class="text-4xl font-bold text-center mb-4 ml-10">Welcome to Fraud Detection</h1>
    <form action="" method="post" class="flex flex-col items-center space-y-6">
        {% csrf_token %}
        {% for field in form %}
            <div class="flex flex-col md:flex-row items-start w-full">
                <!-- Label (white text) -->
                <label for="{{ field.id_for_label }}" class="text-lg font-medium text-white md:mr-4 mb-2 md:mb-0">
                    {{ field.label }}:
                </label>
                <!-- Input Field -->
                {{ field.as_widget }}
            </div>
        {% endfor %}
        <button type="submit" class="px-4 py-2 md:ml-24 bg-[#F5820F] rounded hover:bg-red-600 transition-colors">
            Register
        </button>
    </form>
</div>

{% endblock %}
