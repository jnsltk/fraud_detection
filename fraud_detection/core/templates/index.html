{% extends "base_generic.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <!-- Welcome Section -->
    <div class="bg-white shadow-md rounded-lg p-6 my-4">
        <h1 class="text-3xl font-bold text-blue-900 mb-4">Welcome</h1>
        <p class="text-gray-700">
            Welcome to the fraud detection website. Explore our features and stay secure.
        </p>
    </div>

    <!-- Dynamic Content Section -->
    <div class="bg-white shadow-md rounded-lg p-6 my-4">
        <h2 class="text-2xl font-semibold text-blue-900 mb-4">Dynamic Content</h2>
        <p class="text-gray-700">
            We have the following message for you: <span class="font-medium">{{ message }}</span>
        </p>
    </div>
</div>
{% endblock %}
