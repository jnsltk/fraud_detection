{% extends "core/base_generic.html" %}

{% block content %}

{% include "home_page/nav_bar.html" %}

<div class="flex flex-col justify-start items-center bg-gradient-to-bl from-[#f53f0f] to-[#102c89] h-screen w-screen text-white pt-12">
    <h1 class="text-5xl font-bold text-center mb-6">Transaction Fraud Detection</h1>
    <p class="text-center text-lg">Enter transaction details below to check for potential fraud.</p>
    
    <!-- Fraud Detection Form -->
    <form action="{% url 'core/detection_result' %}" method="post" class="flex flex-col items-center space-y-20 w-4/5 max-w-6xl">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-x-36 gap-y-16 w-full">
            <!-- Merchant -->
            <div class="flex flex-col">
                <label for="merchant" class="text-lg font-medium text-white">
                    Merchant:
                </label>
                <select id="merchant" name="merchant" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Merchant</option>
                    <option value="Taco Bell">Taco Bell</option>
                    <option value="Steam">Steam</option>
                    <option value="Whole Foods">Whole Foods</option>
                    <option value="Exxon">Exxon</option>
                    <option value="Medical Center">Medical Center</option>
                    <option value="Coursera">Coursera</option>
                    <option value="Instacart">Instacart</option>
                    <option value="Westin">Westin</option>
                    <option value="eBay">eBay</option>
                    <option value="DuaneReade">DuaneReade</option>
                    <option value="Nobu">Nobu</option>
                    <option value="FreshDirect">FreshDirect</option>
                    <option value="Ticketmaster">Ticketmaster</option>
                    <option value="American Airlines">American Airlines</option>
                    <option value="Home Depot">Home Depot</option>
                    <option value="Morton's">Morton's</option>
                    <option value="Skillshare">Skillshare</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            <!-- Merchant Type -->
            <div class="flex flex-col">
                <label for="merchant_type" class="text-lg font-medium text-white">
                    Merchant Type:
                </label>
                <select id="merchant_type" name="merchant_type" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Merchant Type</option>
                    <option value="fast_food">Fast Food</option>
                    <option value="gaming">Gaming</option>
                    <option value="physical">Physical</option>
                    <option value="major">Major</option>
                    <option value="medical">Medical</option>
                    <option value="online">Online</option>
                    <option value="premium">Premium</option>
                    <option value="events">Events</option>
                    <option value="airlines">Airlines</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            <!-- Merchant Category -->
            <div class="flex flex-col">
                <label for="merchant_category" class="text-lg font-medium text-white">
                    Merchant Category:
                </label>
                <select id="merchant_category" name="merchant_category" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Merchant Category</option>
                    <option value="Restaurant">Restaurant</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Grocery">Grocery</option>
                    <option value="Gas">Gas</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Retail">Retail</option>
                    <option value="Travel">Travel</option>
                    <option value="Unknown">Other</option>

                </select>
            </div>

            <!-- Currency -->
            <div class="flex flex-col">
                <label for="currency" class="text-lg font-medium text-white">
                    Currency:
                </label>
                <select id="currency" name="currency" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Currency</option>
                    <option value="GBP">GBP</option>
                    <option value="BRL">BRL</option>
                    <option value="JPY">JPY</option>
                    <option value="AUD">AUD</option>
                    <option value="NGN">NGN</option>
                    <option value="EUR">EUR</option>
                    <option value="MXN">MXN</option>
                    <option value="RUB">RUB</option>
                    <option value="CAD">CAD</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            <!-- Amount -->
            <div class="flex flex-col">
                <div class="flex items-center">
                    <label for="amount" class="text-lg font-medium text-white mr-2">
                        Amount:
                    </label>
                    <!-- Hint text for equivalent amount in Euro -->
                    <span id="currency-hint" class="text-xs font-bold text-white mt-1 hidden">
                        Enter the equivalent amount in euro
                    </span>
                </div>
                <input
                    id="amount"
                    name="amount"
                    type="number"
                    step="0.01"
                    placeholder="Enter Amount"
                    class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black"
                    required />
            </div>

            <!-- Country -->
            <div class="flex flex-col">
                <label for="country" class="text-lg font-medium text-white">
                    Country:
                </label>
                <select id="country" name="country" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Country</option>
                    <option value="UK">UK</option>
                    <option value="Brazil">Brazil</option>
                    <option value="Japan">Japan</option>
                    <option value="Australia">Australia</option>
                    <option value="Nigeria">Nigeria</option>
                    <option value="Germany">Germany</option>
                    <option value="Russia">Russia</option>
                    <option value="Mexico">Mexico</option>
                    <option value="France">France</option>
                    <option value="Canada">Canada</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            <!-- Card Type -->
            <div class="flex flex-col">
                <label for="card_type" class="text-lg font-medium text-white">
                    Card Type:
                </label>
                <select id="card_type" name="card_type" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Card Type</option>
                    <option value="Credit">Credit</option>
                    <option value="Debit">Debit</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            <!-- Device -->
            <div class="flex flex-col">
                <label for="device" class="text-lg font-medium text-white">
                    Device:
                </label>
                <select id="device" name="device" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Device</option>
                    <option value="Mobile">Mobile</option>
                    <option value="Desktop">Desktop</option>
                    <option value="Tablet">Tablet</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            <!-- Channel -->
            <div class="flex flex-col">
                <label for="channel" class="text-lg font-medium text-white">
                    Channel:
                </label>
                <select id="channel" name="channel" class="px-4 py-2 rounded-lg border-2 border-blue-800 text-lg text-black" required>
                    <option value="" disabled selected>Select Channel</option>
                    <option value="Online">Online</option>
                    <option value="In-store">In-store</option>
                    <option value="Unknown">Other</option>
                </select>
            </div>

            
        </div>

        <!-- Submit Button -->
        <button type="submit" class="px-16 py-3 bg-[#F5820F] rounded hover:bg-red-600 transition-colors">
            Detect
        </button>

    </form>

</div>

<script>
    // Get references to the currency select and hint text elements
    const currencySelect = document.getElementById('currency');
    const hintText = document.getElementById('currency-hint');

    // Add an event listener to the currency field to check for "Other" or "Unknown"
    currencySelect.addEventListener('change', function() {
        if (currencySelect.value === 'Unknown') {
            // Show the hint text when "Other" or "Unknown" is selected
            hintText.classList.remove('hidden');
        } else {
            // Hide the hint text for other currency options
            hintText.classList.add('hidden');
        }
    });
</script>

{% endblock %}
